<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universities of Wisconsin — Applicant Portal</title>
  <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}" referrerpolicy="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/airbnb.css">
  <link rel="stylesheet" href="{% static 'css/Applicants/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/Applicants/auth.css' %}">
  <link rel="stylesheet" href="{% static 'css/Applicants/portal.css' %}">
  <link rel="stylesheet" href="{% static 'css/Applicants/application_wizard.css' %}">
  <link rel="stylesheet" href="{% static 'css/Applicants/portal_status.css' %}">
<link rel="stylesheet" href="{% static 'css/Applicants/notifications.css' %}?v=2">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
{% block body %}{% endblock %}
{% if messages %}
{% for msg in messages %}
<div class="auth-toast" data-toast-id="{{ forloop.counter }}">
  <i class="auth-toast-icon fas {% if msg.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
  <div class="auth-toast-content"><strong>{% if msg.tags == 'success' %}Success{% else %}Notice{% endif %}</strong><small>{{ msg }}</small></div>
  <button class="auth-toast-close" type="button" onclick="closeToast()"><i class="fas fa-times"></i></button>
</div>
{% endfor %}
{% endif %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="{% static 'js/Applicants/validation.js' %}"></script>
<script src="{% static 'js/Applicants/auth.js' %}"></script>
<script src="{% static 'js/Applicants/portal.js' %}"></script>
<script src="{% static 'notifications/js/live.js' %}"></script>
<script src="{% static 'js/Applicants/portal_notifications.js' %}?v=3"></script>
</body>
</html>
