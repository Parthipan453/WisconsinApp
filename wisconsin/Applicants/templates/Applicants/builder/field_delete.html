{% extends 'Applicants/builder/base.html' %}
{% block title %}
  Delete Field
{% endblock %}
{% block content %}
  <div class="bld-confirm">
    <div class="bld-confirm-card">
      <h2>Delete "{{ field.label }}"?</h2>
      <p>This will delete this field and all its choices, validation rules, and visibility rules.</p>
      <form method="POST">
        {% csrf_token %}
        <div class="bld-form-actions" style="justify-content:center">
          <a href="{% url 'builder_field_edit' field.pk %}" class="bld-btn bld-btn-outline">Cancel</a>
          <button type="submit" class="bld-btn bld-btn-danger"><i class="ti ti-trash"></i> Delete</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
