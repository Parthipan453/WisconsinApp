{% extends "Applicants/builder/base.html" %}
{% block title %}Delete Section{% endblock %}
{% block content %}
<div class="bld-confirm">
  <div class="bld-confirm-card">
    <h2>Delete "{{ section.title }}"?</h2>
    <p>This will delete this section and all its fields.</p>
    <form method="POST">
      {% csrf_token %}
      <div class="bld-form-actions" style="justify-content:center">
        <a href="{% url 'builder_form_edit' section.form_id %}" class="bld-btn bld-btn-outline">Cancel</a>
        <button type="submit" class="bld-btn bld-btn-danger"><i class="ti ti-trash"></i> Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
