{% load static %}
<footer class="uw-premium-footer" role="contentinfo" aria-label="Universities of Wisconsin footer">
  <div class="uw-footer-inner">
    <div class="uw-footer-top">
      <div class="uw-footer-logo-wrap">
        <a href="./" aria-label="Universities of Wisconsin home">
          <img src="{% static 'images/apply-uw.png' %}" alt="Universities of Wisconsin" class="uw-footer-logo">
        </a>
      </div>
      <div class="uw-footer-divider-vert" aria-hidden="true"></div>
      <nav class="uw-footer-policies" aria-label="Admissions policies and resources">
        <a href="#" class="uw-footer-policy-item">
          <i data-lucide="shield-check" class="uw-footer-policy-icon" aria-hidden="true" stroke-width="2"></i>
          <span class="uw-footer-policy-text">UWS Policies</span>
        </a>
        <a href="#" class="uw-footer-policy-item">
          <i data-lucide="file-text" class="uw-footer-policy-icon" aria-hidden="true" stroke-width="2"></i>
          <span class="uw-footer-policy-text">Admissions Policies</span>
        </a>
        <a href="#" class="uw-footer-policy-item">
          <i data-lucide="lock" class="uw-footer-policy-icon" aria-hidden="true" stroke-width="2"></i>
          <span class="uw-footer-policy-text">Privacy Policy</span>
        </a>
        <a href="#" class="uw-footer-policy-item">
          <i data-lucide="accessibility" class="uw-footer-policy-icon" aria-hidden="true" stroke-width="2"></i>
          <span class="uw-footer-policy-text">Accessibility</span>
        </a>
        <a href="#" class="uw-footer-policy-item">
          <i data-lucide="phone" class="uw-footer-policy-icon" aria-hidden="true" stroke-width="2"></i>
          <span class="uw-footer-policy-text">Support</span>
        </a>
      </nav>
    </div>
    <hr class="uw-footer-separator" aria-hidden="true">
    <div class="uw-footer-bottom">
      <div class="uw-footer-seal-row">
        <span class="uw-footer-rule uw-footer-rule-left" aria-hidden="true"></span>
        <img src="{% static 'images/uw-crest.svg' %}" alt="University of Wisconsin Seal" class="uw-footer-seal">
        <span class="uw-footer-rule uw-footer-rule-right" aria-hidden="true"></span>
      </div>
      <p class="uw-footer-copyright">
        &copy; 2026 Board of Regents of the Universities of Wisconsin. All Rights Reserved.
      </p>
       
    </div>
  </div>
</footer>
