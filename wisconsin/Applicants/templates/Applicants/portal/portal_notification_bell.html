{% load static %}
<!-- Applicant notification bell (AJAX) -->
<div class="apn-bell {% if floating %}apn-bell--float{% endif %}"
     data-recent-url="{% url 'applicant_notifications_recent' %}"
     data-read-all-url="{% url 'applicant_notifications_mark_all' %}"
     data-history-url="{% url 'applicant_notifications' %}">
  <button type="button" class="apn-bell__toggle" aria-label="Notifications">
    <i class="fas fa-bell"></i>
    <span class="apn-bell__badge" hidden>0</span>
  </button>
  <div class="apn-dropdown" hidden>
    <div class="apn-dropdown__head">
      <span>Notifications</span>
      <button type="button" class="apn-dropdown__mark-all">Mark all read</button>
    </div>
    <ul class="apn-dropdown__list">
      <li class="apn-dropdown__empty">Loading…</li>
    </ul>
    <a class="apn-dropdown__foot" href="{% url 'applicant_notifications' %}">View all notifications <i class="fas fa-arrow-right"></i></a>
  </div>
</div>
