{% load static %}
{% if checklist_items %}
<div class="uw-form-premium" style="margin-top:16px">
  <h2 style="font-family:var(--uw-font-heading);font-size:18px;font-weight:700;color:#222;margin:0 0 16px">To Do List</h2>
  <div style="display:flex;flex-direction:column;gap:8px">
    {% for item in checklist_items %}
    <div class="uw-dash-card" style="{% if item.is_completed %}opacity:0.6{% endif %}">
      <div class="uw-dash-card-body" style="padding:10px 16px;display:flex;align-items:center;gap:12px">
        <div style="width:22px;height:22px;border-radius:50%;border:2px solid {% if item.is_completed %}#16a34a{% else %}#d0d0d0{% endif %};display:flex;align-items:center;justify-content:center;flex-shrink:0">
          {% if item.is_completed %}<i class="fas fa-check" style="font-size:11px;color:#16a34a"></i>{% endif %}
        </div>
        <div style="flex:1;min-width:0">
          <p style="font-size:14px;font-weight:500;color:#333;margin:0">{{ item.label }}</p>
          {% if item.notes %}<p style="font-size:12px;color:#888;margin:2px 0 0">{{ item.notes }}</p>{% endif %}
        </div>
        <span class="uw-badge" style="font-size:11px;{% if item.is_completed %}background:#dcfce7;color:#166534{% else %}background:#fef3c7;color:#92400e{% endif %}">
          {{ item.is_completed|yesno:"Received,Pending" }}
        </span>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
