{% load static %}
<div class="auth-header-wrap">
  <div class="uw-global-bar">
    <a href="./" class="uw-global-name-link"><img src="{% static 'images/apply-uw.png' %}" alt="Universities of Wisconsin" /></a>
    <nav class="apply-top-nav d-none d-lg-flex" aria-label="Admissions navigation">
      <a href="#"><i class="fas fa-graduation-cap"></i><span>Direct Admit Wisconsin</span></a>
      <a href="#apply-faq"><i class="fas fa-book-open"></i><span>How to Apply</span></a>
      <a href="#"><i class="fas fa-calendar-days"></i><span>Find Your Term</span></a>
      <a href="#"><i class="fas fa-magnifying-glass"></i><span>Find a Program</span></a>
      <a href="#"><i class="fas fa-envelope"></i><span>Contact Us</span></a>
    </nav>
    <button class="apply-top-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#authTopOffcanvas" aria-controls="authTopOffcanvas" aria-label="Open navigation"><i class="fas fa-bars"></i></button>
  </div>
</div>

<div class="offcanvas offcanvas-end apply-offcanvas" tabindex="-1" id="authTopOffcanvas" aria-labelledby="authTopOffcanvasLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="authTopOffcanvasLabel"><img src="{% static 'images/apply-uw.png' %}" alt="Universities of Wisconsin" class="apply-offcanvas-brand" /></h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <nav class="apply-offcanvas-nav" aria-label="Mobile admissions navigation">
      <a href="#"><i class="fas fa-graduation-cap"></i>Direct Admit Wisconsin</a>
      <a href="#apply-faq" data-bs-dismiss="offcanvas"><i class="fas fa-book-open"></i>How to Apply</a>
      <a href="#"><i class="fas fa-calendar-days"></i>Find Your Term</a>
      <a href="#"><i class="fas fa-magnifying-glass"></i>Find a Program</a>
      <a href="#"><i class="fas fa-envelope"></i>Contact Us</a>
    </nav>
  </div>
</div>
