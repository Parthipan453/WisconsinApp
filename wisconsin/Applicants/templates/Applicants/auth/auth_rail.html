{% load static %}
<aside class="apply-auth-rail" aria-label="Applicant portal navigation">
  <a href="./" class="apply-auth-rail-brand" aria-label="Universities of Wisconsin home"><img src="{% static 'images/apply-uw.png' %}" alt="Universities of Wisconsin" /></a>

  <nav class="apply-auth-rail-nav" aria-label="Quick links">
    <a href="./?state=how-to-apply" class="apply-auth-rail-step">
      <span class="apply-auth-rail-icon" aria-hidden="true"><i class="fas fa-clipboard-list"></i></span>
      <span class="apply-auth-rail-text">
        <span class="apply-auth-rail-title">How to Apply</span>
        <span class="apply-auth-rail-arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
      </span>
    </a>
    <a href="./" class="apply-auth-rail-step">
      <span class="apply-auth-rail-icon" aria-hidden="true"><i class="fas fa-list-check"></i></span>
      <span class="apply-auth-rail-text">
        <span class="apply-auth-rail-title">Admission Requirements</span>
        <span class="apply-auth-rail-arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
      </span>
    </a>
    <a href="./" class="apply-auth-rail-step">
      <span class="apply-auth-rail-icon" aria-hidden="true"><i class="fas fa-circle-question"></i></span>
      <span class="apply-auth-rail-text">
        <span class="apply-auth-rail-title">Need Help?</span>
        <span class="apply-auth-rail-arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
      </span>
    </a>
    <a href="./?state=find-program" class="apply-auth-rail-step">
      <span class="apply-auth-rail-icon" aria-hidden="true"><i class="fas fa-magnifying-glass"></i></span>
      <span class="apply-auth-rail-text">
        <span class="apply-auth-rail-title">Find a Program</span>
        <span class="apply-auth-rail-arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
      </span>
    </a>
    <a href="./?state=find-term" class="apply-auth-rail-step">
      <span class="apply-auth-rail-icon" aria-hidden="true"><i class="fas fa-calendar-days"></i></span>
      <span class="apply-auth-rail-text">
        <span class="apply-auth-rail-title">Find Your Term</span>
        <span class="apply-auth-rail-arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
      </span>
    </a>
    {% if auth_mode == 'login' %}
      <a href="./?auth=register" class="apply-auth-rail-step">
        <span class="apply-auth-rail-icon" aria-hidden="true"><i class="fas fa-user-plus"></i></span>
        <span class="apply-auth-rail-text">
          <span class="apply-auth-rail-title">Need an account?</span>
          <span class="apply-auth-rail-arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
        </span>
      </a>
    {% elif auth_mode == 'register' %}
      <a href="./?auth=login" class="apply-auth-rail-step">
        <span class="apply-auth-rail-icon" aria-hidden="true"><i class="fas fa-right-to-bracket"></i></span>
        <span class="apply-auth-rail-text">
          <span class="apply-auth-rail-title">Already have an account?</span>
          <span class="apply-auth-rail-arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
        </span>
      </a>
    {% endif %}
  </nav>

  <div class="apply-auth-rail-divider" role="separator" aria-hidden="true">
    <span class="apply-auth-rail-divider-dot"></span>
  </div>

  <a href="./" class="apply-auth-rail-home">
    <span class="apply-auth-rail-home-icon" aria-hidden="true"><i class="fas fa-house"></i></span>
    <span class="apply-auth-rail-home-text">Back to Home</span>
  </a>
</aside>
