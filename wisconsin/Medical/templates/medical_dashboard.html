{% extends "medical_base.html" %}
{% load static %}

{% block extra_css %}

<link rel="stylesheet" href="{% static "css/medical_dashboard.css" %}" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

{% endblock %}


{% block content %}

<div class="md-dashboard-container" id="medicalDashboard"
     data-dashboard-url="{% url 'Medical:medical_dashboard_data' uuid=user.uuid %}">

    <section class="md-stats-grid" id="statsGrid">
    </section>

<div class="row g-3 mb-3">
    <div class="col-12 col-lg-6">
        <div class="md-card">
            <div class="md-card-header"><h3 id="chartOneTitle"><i class="fas fa-chart-line"></i></h3></div>
            <div class="md-chart-container"><canvas id="chartOne"></canvas></div>
        </div>
    </div>
    <div class="col-12 col-lg-6">
        <div class="md-card">
            <div class="md-card-header"><h3 id="chartTwoTitle"><i class="fas fa-chart-bar"></i></h3></div>
            <div class="md-chart-container"><canvas id="chartTwo"></canvas></div>
        </div>
    </div>
</div>

<div class="row g-3 mb-3">
    <div class="col-12 col-lg-6">
        <div class="md-card">
            <div class="md-card-header"><h3 id="chartThreeTitle"><i class="fas fa-chart-pie"></i></h3></div>
            <div class="md-chart-container"><canvas id="chartThree"></canvas></div>
        </div>
    </div>
    <div class="col-12 col-lg-6">
        <div class="md-card">
            <div class="md-card-header"><h3 id="chartFourTitle"><i class="fas fa-chart-pie"></i></h3></div>
            <div class="md-chart-container"><canvas id="chartFour"></canvas></div>
        </div>
    </div>
</div>

    <div class="row g-3 mb-3">
        <div class="col-12 col-lg-6">
            <div class="md-card">
                <div class="md-card-header"><h3><i class="fas fa-clock"></i> Recent Activity</h3></div>
                <div class="md-timeline" id="recentActivityTimeline"></div>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="md-card">
                <div class="md-card-header"><h3 id="sidePanelTitle"><i class="fas fa-circle"></i></h3></div>
                <div class="md-status-list" id="sidePanelList"></div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="{% static "js/medical_dashboard.js" %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

{% endblock %}
