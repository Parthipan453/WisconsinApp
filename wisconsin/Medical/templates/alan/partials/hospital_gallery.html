{% for image in gallery_images %}

<div class="smh-gallery-card">

    <button
        class="gallery-delete-btn"
        data-id="{{ image.id }}"
        title="Delete Image">

        <i class="bi bi-trash3-fill"></i>

    </button>

    <img src="{{ image.image.url }}" alt="{{ image.alt_text }}">

    {% if image.caption %}
        <div class="smh-gallery-overlay">
            {{ image.caption }}
        </div>
    {% endif %}

</div>

{% empty %}

<div class="smh-gallery-empty">
    No gallery images available.
</div>

{% endfor %}
