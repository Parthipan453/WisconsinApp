{% spaceless %}
    {% if announcements %}
        <div class="announce-ticker" data-ticker data-direction="rtl">
            <div class="announce-ticker-label">
                <i data-lucide="megaphone"></i>
                <span>Announcements</span>
            </div>

            <div class="announce-ticker-viewport">
                <div class="announce-ticker-track">
                    {% for loop_copy in "12" %}
                        {% for a in announcements %}
                        <button type="button"
                                class="announce-ticker-item announce-ticker-{{ a.priority }}"
                                data-ticker-item
                                data-title="{{ a.title }}"
                                data-message="{{ a.message }}"
                                data-date="{{ a.start_date|date:'M d, Y' }}"
                                data-time="{{ a.start_date|date:'h:i A' }}"
                                data-priority="{% if a.priority == 'urgent' %}Urgent{% elif a.priority == 'warning' %}Warning{% else %}Info{% endif %}">
                            {% if a.priority == 'urgent' %}
                                <i data-lucide="alert-triangle"></i>
                            {% elif a.priority == 'warning' %}
                                <i data-lucide="alert-circle"></i>
                            {% else %}
                                <i data-lucide="info"></i>
                            {% endif %}
                            <span class="announce-ticker-title">{{ a.title }}</span>
                            <span class="announce-ticker-sep">—</span>
                            <span>{{ a.message|truncatechars:80 }}</span>
                        </button>
                        {% endfor %}
                    {% endfor %}
                </div>
            </div>
        </div>
    {% endif %}

    <div class="announce-modal" data-announce-modal aria-hidden="true" role="dialog" aria-modal="true">
        <div class="announce-modal-backdrop" data-announce-close></div>
        <div class="announce-modal-card">
            <div class="announce-modal-header">
                <span class="announce-modal-priority" data-modal-priority data-priority-level="info">Announcement</span>
                <button type="button" class="announce-modal-close" data-announce-close aria-label="Close">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="announce-modal-body">
                <h3 class="announce-modal-title" data-modal-title></h3>
                <p class="announce-modal-message" data-modal-message></p>
            </div>
            <div class="announce-modal-footer">
                <span class="announce-modal-meta"><i data-lucide="calendar"></i> <span data-modal-date>—</span></span>
                <span class="announce-modal-meta"><i data-lucide="clock"></i> <span data-modal-time>—</span></span>
            </div>
        </div>
    </div>
{% endspaceless %}
