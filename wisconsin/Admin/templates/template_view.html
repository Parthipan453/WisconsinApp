{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Dispatch — College News</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Source+Sans+3:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="{% static 'css/template_view.css'%}">
  
</head>
<body>

    <!-- Skip to content (accessibility) -->
    <a href="#articleBody" class="skip-link">Skip to content</a>

    <!-- Ink Bloom Background -->
    <div class="ink-bloom" aria-hidden="true"><span></span><span></span><span></span></div>

    <!-- Reading Progress -->
    <div class="reading-progress" role="progressbar" aria-label="Reading progress">
        <div class="bar" id="progressBar"></div>
    </div>
    <div class="progress-readout" id="progressReadout">00%</div>

    <!-- Dark Mode Toggle -->
    <button class="dark-toggle" id="darkToggle" aria-label="Toggle dark mode">
        <i class="bi bi-moon-fill" id="darkIcon"></i>
    </button>

    <!-- Desktop Sticky Share -->

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- MAIN CONTENT -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <main class="wrap" id="articleContainer">

        <!-- Masthead -->
        <nav class="masthead" aria-label="Breadcrumb">
            <span class="brand">The <em>Dispatch</em></span>
            <span class="crumbs" id="crumbs">
                <a href="#">Home</a><span class="sep">/</span>
                <a href="#" id="breadcrumbCategory">Category</a><span class="sep">/</span>
                <span id="breadcrumbTitle">Article</span>
            </span>
        </nav>

        <!-- Article Hero -->
        <header class="article-hero">
            <p class="dateline" id="dateline">
                <span class="live-dot" aria-hidden="true"></span><span></span>
            </p>
            <a href="#" class="stamp" id="categoryBadge">Category</a>
            <h1 class="hero-title" id="heroTitle">
                Article Title<span class="title-underline"></span>
            </h1>
            <p class="hero-subtitle" id="heroSubtitle">Subtitle</p>
            <div class="hero-meta">
                <span class="meta-item">
                    <img src="" alt="Author" class="author-avatar" id="authorAvatar" loading="lazy" />
                    <span class="author-name" id="authorName">Author</span>
                </span>
                <span class="meta-divider" aria-hidden="true">·</span>
                <span class="meta-item"><i class="bi bi-calendar3"></i> <span id="publishedDate">Today</span></span>
                <span class="meta-item" id="updatedDateWrap" style="display:none;">
                    <i class="bi bi-pencil-square"></i> Updated <span id="updatedDate"></span>
                </span>
                <span class="meta-divider" aria-hidden="true">·</span>
                <span class="meta-item"><i class="bi bi-clock"></i> <span id="readingTime">5 min read</span></span>
            </div>
        </header>

        <!-- Hero Media -->
        <figure class="hero-media" id="heroMedia">
            <img src="" alt="Hero image" id="heroImage" loading="lazy" />
            <figcaption class="media-caption" id="heroCaption"></figcaption>
        </figure>

        <!-- Article Body (dynamically rendered) -->
        <article class="article-body" id="articleBody" aria-label="Article content"></article>

        <!-- Tags -->
        <div class="tags-section" id="tagsSection"></div>

        <hr class="section-divider" />

        <!-- Author Bio -->
        <section class="author-bio" id="authorBio" aria-label="About the author">
            <img src="" alt="Author" class="bio-avatar" loading="lazy" />
            <div class="bio-content">
                <h5></h5>
                <div class="bio-role"></div>
                <p></p>
                <!-- <div class="bio-social">
                    <a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
                    <a href="#" aria-label="GitHub"><i class="bi bi-github"></i></a>
                    <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
                    <a href="#" aria-label="Website"><i class="bi bi-globe2"></i></a>
                </div> -->
            </div>
        </section>

        <!-- Prev / Next -->
        <nav class="prev-next" id="prevNextNav" aria-label="Previous and next articles"></nav>

        <!-- Related Coverage -->
        <section class="related-section" id="relatedSection" aria-label="Related articles">
            <h2 class="section-title">Related Coverage</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </section>
        <!-- Comments -->
        <!-- <section class="comments-section" id="commentsSection" aria-label="Comments">
            <h2 class="section-title">Comments</h2>
            <p class="comments-sub">Join the conversation — share your thoughts below.</p>
            <div class="comment-placeholder">
                <i class="bi bi-chat-dots fs-4 d-block mb-2"></i>
                <p class="mb-0"><strong>Comments are disabled</strong> for this demo.</p>
            </div>
        </section> -->

        <!-- Newsletter -->
        <!-- <section class="newsletter-section" id="newsletterSection" aria-label="Newsletter signup">
            <h3>Stay on the Wire</h3>
            <p>Get the latest dispatches delivered to your inbox every morning.</p>
            <form class="newsletter-form" onsubmit="event.preventDefault(); alert('Thanks for subscribing! (demo)');">
                <input type="email" placeholder="Enter your email" required aria-label="Email address" />
                <button type="submit">Subscribe</button>
            </form>
        </section> -->

        <!-- Ad Placeholder -->
        <!-- <div class="ad-placeholder" id="adPlaceholder">
            <span class="ad-label">Advertisement</span>
            <div class="mt-1"><i class="bi bi-megaphone"></i> Your ad could be here — <a href="#">Learn more</a></div>
        </div> -->

    </main>


<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'script/alan/template_view.js' %}"></script>
</body>
</html>
