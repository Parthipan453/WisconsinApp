{% if messages %}
<div class="za-messages" id="zaMessages">
  {% for msg in messages %}
  <div class="za-toast za-toast-{{ msg.tags }}" role="alert">
    <i class="ti ti-{% if msg.tags == 'success' %}check-circle{% elif msg.tags == 'error' %}alert-circle{% elif msg.tags == 'warning' %}alert-triangle{% else %}info-circle{% endif %}"></i>
    <span>{{ msg }}</span>
    <button type="button" class="za-toast-close" onclick="this.parentElement.remove()">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
