{% load static %}

<div class="staff-list">

    {% for person in staff %}

    <div class="staff-card">

        <div class="staff-card-header">

            {% if person.profile_photo %}
                <img
                    src="{{ person.profile_photo.url }}"
                    class="staff-photo"
                    alt="{{ person.staff.user.get_full_name }}">
            {% else %}
                <img
                    src="{% static 'images/rupa/default-user.png' %}"
                    class="staff-photo"
                    alt="Default">
            {% endif %}

        </div>

        <div class="staff-card-body">

            <h3>
                <a href="{% url 'staff_profile' person.id %}">
                    {{ person.staff.user.get_full_name }}
                </a>
            </h3>

            <h5>{{ person.get_role_display }}</h5>

            <hr>

            <div class="staff-info">
                <strong>Library</strong>
                <p>{{ person.assigned_library.library_name }}</p>
            </div>

            <!-- {% if person.office_location %}

                    <div class="staff-info">

                        <strong>Office</strong>

                        <p>{{ person.office_location }}</p>

                    </div>

            {% endif %} -->

                   <!-- <div class="staff-info">

                       <strong>Email</strong>

                        <a href="mailto:{{ person.staff.work_email }}">
                                        {{ person.staff.work_email }}
                        </a>

                    </div> -->

            <!-- {% if person.staff.office_phone %}

                    <div class="staff-info">

                            <strong>Phone</strong>

                                <p>{{ person.staff.office_phone }}</p>

                            </div>

                {% endif %} -->

                <!-- <a class="profile-btn">

                                View Profile

                    </a> -->


        </div>

    </div>

    {% empty %}

    <div class="empty-directory">
        No Staff Found
    </div>

    {% endfor %}

</div>
