<!-- Navina -->
{% extends "lib_base.html" %}
{% load static %}

{% block title %}
Citation Search
{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
href="{% static 'css/Library/find/citation_search.css' %}">
{% endblock %}

{% block content %}

<section class="citation-page">

    <div class="container">

        <div class="citation-container">

            <h1>Citation Search</h1>

            <p class="subtitle">Select one to search</p>

            <div class="search-group">
                <label>Article Search</label>
                <input type="text" placeholder="magazine, newspaper, and scholarly articles">
            </div>

            <div class="search-group">
                <label>Journal Search</label>
                <input type="text" placeholder="issn, title, or subject">
            </div>

            <div class="search-group">
                <label>DOI Search</label>
                <input type="text" placeholder="Search by DOI (digital object identifier)">
                <span>Or try <a href="#">Web of Science</a></span>
            </div>

            <div class="search-group">
                <label>PMID Search</label>
                <input type="text" placeholder="Search by PMID (PubMed)">
            </div>

            <div class="citation-alert">

                <div class="left">

                    <i class="fa-solid fa-circle-info"></i>

                    <div>

                        <strong>Have a book citation?</strong>

                        <p>Use the <a href="#">library catalog.</a></p>

                    </div>

                </div>

                <button>&times;</button>

            </div>

        </div>

    </div>

</section>

{% endblock %}
