<!-- Navina -->
{% extends "search_base.html" %}
{% load static %}

{% block title %}Advanced Search{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/Library/find/advanced_search.css' %}">
{% endblock %}

{% block content %}
<section class="advanced-search-page">
    <div class="container">
        <form method="GET">
            <div class="advanced-search-wrapper">

                <div class="advanced-search-left">
                    <h1>Advanced Search</h1>
                    <p class="advanced-subtitle">
                        You are searching <strong>UW System</strong>. Switch to search
                        <a href="#">UW‑Madison?</a>
                    </p>

                    <div class="availability-row">
                        <label>
                            <input type="checkbox" name="available_online"
                            {% if request.GET.available_online %}checked{% endif %}>
                            Available Online
                        </label>

                        <label>
                            <input type="checkbox" name="print_items"
                            {% if request.GET.print_items %}checked{% endif %}>
                            Print/Physical Items
                        </label>
                    </div>

                    <div class="form-group">
                        <label>Match</label>
                        <select class="choices-select" name="match">
                            <option value="all">All of the fields below</option>
                            <option value="any">Any of the fields below</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Keywords</label>
                        <input type="text" name="keywords"
                        value="{{ request.GET.keywords }}"
                        placeholder='poetry, animal AND (welfare OR rights), "beat generation"'>
                    </div>

                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title"
                        value="{{ request.GET.title }}"
                        placeholder='The Great Gatsby, "Another Country"'>
                    </div>

                    <div class="form-group">
                        <label>Authors / Creators</label>
                        <input type="text" name="author"
                        value="{{ request.GET.author }}"
                        placeholder="Austen Jane, Eliot T.S.">
                    </div>

                    <div class="form-group">
                        <label>Publisher</label>
                        <input type="text" name="publisher"
                        value="{{ request.GET.publisher }}"
                        placeholder="Simon and Schuster, Penguin">
                    </div>

                    <div class="form-group">
                        <label>Series</label>
                        <input type="text" name="series"
                        value="{{ request.GET.series }}"
                        placeholder="Desert access guide">
                    </div>

                    <div class="form-group">
                        <label>Identifiers</label>
                        <input type="text" name="identifiers"
                        value="{{ request.GET.identifiers }}"
                        placeholder="ISBN (omit hyphens), ISSN (include hyphens), etc.">
                    </div>

                    <div class="form-group">
                        <label>Subjects</label>
                        <input type="text" name="subjects"
                        value="{{ request.GET.subjects }}"
                        placeholder='"economic sanctions", College students'>
                    </div>

                    <div class="form-group">
                        <label>Call Numbers</label>
                        <input type="text" name="call_number"
                        value="{{ request.GET.call_number }}"
                        placeholder="PS3562 E9257 B84 1999, C 3.134/7:">
                    </div>

                    <div class="year-wrapper">
                        <div class="year-field">
                            <label>Publication Start</label>
                            <input type="number" name="publication_start"
                            value="{{ request.GET.publication_start }}">
                        </div>

                        <div class="year-field">
                            <label>Publication End</label>
                            <input type="number" name="publication_end"
                            value="{{ request.GET.publication_end }}">
                        </div>
                    </div>

                    <div class="include-resource">
                        <label>
                            <input type="checkbox" name="include_resources"
                            {% if request.GET.include_resources %}checked{% endif %}>
                            Include electronic resources not licensed to UW‑Madison
                        </label>
                    </div>

                    <button class="search-btn" type="submit">
                        Search
                    </button>
                </div>

                <aside class="advanced-search-sidebar">
                    <div class="sidebar-card">
                        <h3>Limit Your Search</h3>

                        <div class="sidebar-group">
                            <select class="choices-select" name="location">
                                <option value="">Locations</option>
                                {% for library in libraries %}
                                <option value="{{ library.id }}">{{ library.library_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="sidebar-group">
                            <select class="choices-select" name="format">
                                <option value="">Format</option>
                                {% for format in formats %}
                                <option value="{{ format }}">{{ format }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="sidebar-group">
                            <select class="choices-select" name="language">
                                <option value="">Language</option>
                                {% for language in languages %}
                                <option value="{{ language }}">{{ language }}</option>
                                {% endfor %}
                            </select>
                        </div>

                    </div>
                </aside>

            </div>
        </form>
    </div>
</section>
{% endblock %}
