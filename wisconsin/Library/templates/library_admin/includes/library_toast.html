<!-- ==========================================
     LIBRARY TOAST CONTAINER
=========================================== -->
<div id="library-toast-container"></div>

<!-- ==========================================
     DJANGO MESSAGES (hidden example)
=========================================== -->
{% if messages %}
    {% for message in messages %}
        <span class="django-toast" 
              data-type="{{ message.tags }}" 
              data-message="{{ message|escape }}" 
              hidden>
        </span>
    {% endfor %}
{% endif %}
